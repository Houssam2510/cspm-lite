[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspm-lite"
version = "0.1.0"
description = "Scanner de posture de securite cloud (CSPM) pour AWS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Houssam" }]
keywords = ["aws", "security", "cspm", "cis-benchmark", "cloud-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Une seule dependance runtime, volontairement : boto3.
# Un outil de securite doit minimiser sa propre surface d'attaque (supply chain).
# La CLI, le rendu et la serialisation utilisent uniquement la bibliotheque standard.
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,iam,ec2,cloudtrail]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
cspm-lite = "cspm_lite.cli:main"

[project.urls]
Repository = "https://github.com/Houssam2510/cspm-lite"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cspm_lite"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# learning/ contient du materiel pedagogique : des squelettes volontairement
# incomplets et un generateur de PDF autonome. Les reformater casserait les
# exercices et n'apporterait rien.
extend-exclude = ["learning"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["botocore.*", "boto3.*", "moto.*"]
ignore_missing_imports = true
