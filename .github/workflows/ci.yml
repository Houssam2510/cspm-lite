name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales par defaut : chaque job reouvre ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Barriere de securite : si un test echappait au mock moto, il ne pourrait pas
  # atteindre un vrai compte AWS avec ces valeurs.
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  AWS_DEFAULT_REGION: us-east-1

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      # Les actions sont epinglees par SHA et non par tag : un tag est mutable,
      # un attaquant qui compromet le depot d'une action pourrait faire pointer
      # "v4" vers du code malveillant execute dans notre CI.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests unitaires
        run: pytest --cov=cspm_lite --cov-report=term-missing --cov-fail-under=80
      - name: Verifier que la suite tourne aussi sans dependances de dev
        if: matrix.python == '3.12'
        run: |
          cd tests && PYTHONPATH=../src python -m unittest discover -q

  demo:
    name: Scan de demonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Le labo de demonstration contient volontairement des findings : on verifie
      # que l'outil sort bien en code 1, c'est le contrat avec une CI reelle.
      - name: L'outil detecte les findings et sort en code 1
        run: |
          set +e
          cspm-lite scan --demo --format markdown --fail-on HIGH > rapport.md
          code=$?
          set -e
          test "$code" -eq 1 || { echo "code de sortie attendu 1, obtenu $code"; exit 1; }
      - name: Regenerer le rapport d'exemple
        run: cspm-lite scan --demo --format html -o docs/example-report.html --fail-on NONE
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: rapport-exemple
          path: |
            docs/example-report.html
            rapport.md

  image:
    name: Image Docker et scan de vulnerabilites
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Construire l'image
        run: docker build -t cspm-lite:ci .
      - name: L'image fonctionne
        run: docker run --rm cspm-lite:ci --version
      - name: Scan Trivy de l'image
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # 0.29.0
        with:
          image-ref: cspm-lite:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Generer un SBOM
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          image: cspm-lite:ci
          format: spdx-json
          artifact-name: sbom.spdx.json
