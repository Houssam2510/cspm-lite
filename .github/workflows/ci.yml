name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales par defaut : chaque job reouvre ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Barriere de securite : si un test echappait au mock moto, il ne pourrait pas
  # atteindre un vrai compte AWS avec ces valeurs.
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  AWS_DEFAULT_REGION: us-east-1

  # Outils de securite epingles par version d'image. Voir ADR-006 : on n'utilise
  # pas les actions GitHub correspondantes, parce qu'elles resolvent a l'execution
  # des sous-actions par tag, ce qui annule l'interet de l'epinglage par SHA.
  TRIVY_IMAGE: aquasec/trivy:0.72.0
  SYFT_IMAGE: anchore/syft:v1.50.0

jobs:
  lint:
    name: Lint et typage
    runs-on: ubuntu-latest
    steps:
      # Les actions sont epinglees par SHA et non par tag : un tag est mutable,
      # un attaquant qui compromet le depot d'une action pourrait faire pointer
      # "v5" vers du code malveillant execute dans notre CI.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Tests unitaires
        run: pytest --cov=cspm_lite --cov-report=term-missing --cov-fail-under=80
      - name: Verifier que la suite tourne aussi sans dependances de dev
        if: matrix.python == '3.12'
        run: cd tests && PYTHONPATH=../src python -m unittest discover -q

  exercices:
    name: Exercices pedagogiques intacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # Les squelettes d'exercices doivent rester incomplets : si l'un d'eux
      # passait au vert, c'est qu'une correction a fuite dans le depot.
      - name: Aucun exercice ne doit passer
        run: |
          sortie=$(bash learning/exercices/verifier.sh)
          echo "$sortie"
          echo "$sortie" | grep -q "0 OK" || {
            echo "::error::un exercice passe au vert : une solution a fuite dans le depot"
            exit 1
          }

  demo:
    name: Scan de demonstration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      # Le labo de demonstration contient volontairement des findings : on verifie
      # que l'outil sort bien en code 1, c'est le contrat avec une CI reelle.
      - name: L'outil detecte les findings et sort en code 1
        run: |
          set +e
          cspm-lite scan --demo --format markdown --fail-on HIGH > rapport.md
          code=$?
          set -e
          test "$code" -eq 1 || { echo "code de sortie attendu 1, obtenu $code"; exit 1; }
      - name: Regenerer les rapports d'exemple
        run: |
          cspm-lite scan --demo --format html -o docs/example-report.html --fail-on NONE
          cspm-lite history --db /tmp/demo.db --seed-demo --format html \
            -o docs/example-history.html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: rapports-exemple
          path: |
            docs/example-report.html
            docs/example-history.html
            rapport.md

  image:
    name: Image Docker et scan de vulnerabilites
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Construire l'image
        run: docker build -t cspm-lite:ci .

      - name: L'image fonctionne, sans root ni gestionnaire de paquets
        run: |
          docker run --rm cspm-lite:ci --version
          docker run --rm cspm-lite:ci scan --demo --fail-on NONE --format json > /dev/null
          uid=$(docker run --rm --entrypoint id cspm-lite:ci -u)
          test "$uid" -ne 0 || { echo "l'image tourne en root"; exit 1; }
          echo "UID d'execution : $uid"
          # Une image de production ne doit embarquer aucun moyen d'installer du code.
          if docker run --rm --entrypoint sh cspm-lite:ci -c "command -v pip" 2>/dev/null; then
            echo "::error::pip est present dans l'image finale"
            exit 1
          fi
          echo "aucun gestionnaire de paquets dans l'image" 

      # Trivy et Syft sont lances depuis leur image officielle epinglee plutot que
      # via leur action GitHub : aucune sous-action resolue par tag, donc aucune
      # dependance transitive mutable. Voir ADR-006.
      - name: Scan Trivy de l'image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              cspm-lite:ci

      - name: Generer un SBOM
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$SYFT_IMAGE" cspm-lite:ci -o spdx-json > sbom.spdx.json
          echo "composants inventories : $(python3 -c \
            "import json;print(len(json.load(open('sbom.spdx.json'))['packages']))")"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom
          path: sbom.spdx.json
