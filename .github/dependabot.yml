version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["pytest*", "ruff", "mypy", "moto"]

  # Les actions sont epinglees par SHA : sans Dependabot elles ne seraient jamais
  # mises a jour, et un SHA fige est aussi un SHA qui accumule les CVE.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
